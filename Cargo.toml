[package]
name = "samply_perfanno"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = "line-tables-only"
panic = "abort"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
wholesym = "0.8.1"
